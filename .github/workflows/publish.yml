name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Test & Validate
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build npm package
        run: npm run build && npm run package:prepare

      - name: Publish with npm Trusted Publishing
        run: npm publish ./dist

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    needs: validate
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish with JSR OIDC
        run: npx --yes jsr publish
