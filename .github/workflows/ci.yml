name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:preview

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Preview package
        run: npm run package:preview

      - name: verify package versions
        run: npm run package:verify
